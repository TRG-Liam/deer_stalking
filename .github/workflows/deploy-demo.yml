name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Start WordPress Playground
        run: |
          npx --yes @wp-playground/cli@3.1.48 server --port=8881 \
            --mount=./theme/cambridgeshire-deer-stalking:/wordpress/wp-content/themes/cambridgeshire-deer-stalking \
            --blueprint=./dev/ci-blueprint.json &
          # The port answers before WordPress is ready, and WordPress answers
          # before the blueprint has finished (language pack, theme). Wait
          # for the home page built by the theme, not just any 200.
          for i in $(seq 1 150); do
            curl -sf http://127.0.0.1:8881/ | grep -q "cds-hero-cover" && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8881/ | grep -q "cds-hero-cover" || { echo "Site never came up with the theme active"; exit 1; }

      - name: Snapshot site to static HTML
        run: |
          mkdir -p _site
          wget --mirror --convert-links --adjust-extension --page-requisites \
               --no-parent --no-host-directories --directory-prefix=_site \
               --exclude-directories=wp-admin,wp-json \
               --reject-regex '[?]' \
               --reject 'xmlrpc*,wp-login*' \
               http://127.0.0.1:8881/ || true

          # GitHub Pages serves 404.html for unknown addresses: use the
          # theme's own not-found page. Its root-relative links are pointed
          # at the Pages subpath here, since wget never sees this file.
          curl -s -o _site/404.html http://127.0.0.1:8881/cds-not-a-real-page/
          sed -i -E 's#href="/"#href="/deer_stalking/"#g; s#(href|src)="/([^/"])#\1="/deer_stalking/\2#g' _site/404.html

          # WordPress prints some link tags with single-quoted attributes:
          # normalise them to double quotes so one set of patterns covers all.
          find _site -name '*.html' -type f -exec sed -i "s/href='\([^']*\)'/href=\"\1\"/g; s/src='\([^']*\)'/src=\"\1\"/g" {} +

          # wget skips query-string URLs, which is exactly how WordPress serves
          # its CSS and JS (style.css?ver=...). Fetch each one to its query-less
          # path, then strip the version queries from the HTML so references match.
          grep -rhoE '(href|src)="http://127\.0\.0\.1:8881/[^"]*\?[^"]*"' _site --include='*.html' \
            | sed -E 's/^(href|src)="//; s/"$//' | sort -u | while read -r url; do
              clean="${url%%\?*}"
              rel="${clean#http://127.0.0.1:8881/}"
              [ -z "$rel" ] && continue
              mkdir -p "_site/$(dirname "$rel")"
              curl -sf "$url" -o "_site/$rel" || echo "WARN could not fetch $url"
            done
          find _site -name '*.html' -type f -exec sed -i -E 's/\?ver=[^"]*"/"/g' {} +

          # Theme assets referenced from inline CSS (fonts) are invisible to wget: copy them wholesale.
          mkdir -p _site/wp-content/themes/cambridgeshire-deer-stalking
          cp -r theme/cambridgeshire-deer-stalking/assets _site/wp-content/themes/cambridgeshire-deer-stalking/

          # Rewrite any remaining absolute sandbox URLs to the Pages subpath.
          find _site \( -name '*.html' -o -name '*.css' -o -name '*.js' \) -type f \
            -exec sed -i 's#http://127\.0\.0\.1:8881#/deer_stalking#g' {} +

          touch _site/.nojekyll

          # Sanity gates. These check structure, never wording, so a copy
          # edit can not break the deploy: every page exists, the hero and
          # the enquiry form fields survived, the not-found page is the
          # theme's, the demo is marked noindex, no sandbox URLs are left,
          # and every stylesheet the HTML references is in the artifact.
          for page in "" deer-stalking/ the-deer/ deer-management/ contact/ privacy-policy/; do
            test -f "_site/${page}index.html" || { echo "MISSING page: /${page}"; exit 1; }
          done
          grep -q 'cds-hero-cover' _site/index.html || { echo "Home hero missing"; exit 1; }
          grep -q '<input' _site/contact/index.html || { echo "Enquiry form fields missing"; exit 1; }
          grep -q 'cds-section--404' _site/404.html || { echo "Not-found page missing"; exit 1; }
          grep -q 'noindex' _site/index.html || { echo "Demo is not marked noindex"; exit 1; }
          if grep -rlq "127.0.0.1:8881" _site --include='*.html' --include='*.css'; then
            echo "Sandbox URLs left in the snapshot"; exit 1
          fi
          grep -rhoE 'href="/deer_stalking/[^"]*\.css"' _site --include='*.html' \
            | sed -E 's#^href="/deer_stalking/##; s/"$//' | sort -u | while read -r css; do
              test -f "_site/$css" || { echo "MISSING stylesheet: $css"; exit 1; }
            done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
